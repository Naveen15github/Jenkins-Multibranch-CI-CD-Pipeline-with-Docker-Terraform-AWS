sonar.projectKey=jenkins-cicd-pipeline
sonar.projectName=Jenkins CI/CD Pipeline
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Completely disable JavaScript/TypeScript analysis (requires Node.js 18+)
# We're using Node.js 16.20.2 which is not compatible with SonarQube's JS analyzer
sonar.javascript.exclusions=**/*
sonar.typescript.exclusions=**/*
sonar.css.exclusions=**/*

# Skip HTML file analysis to avoid JavaScript in HTML detection
sonar.html.file.suffixes=

# Disable all JavaScript-related sensors
sonar.javascript.node.maxspace=0

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=node_modules/**,coverage/**,scripts/**,**/*.html,**/*.css,**/*.js

sonar.coverage.exclusions=src/server.js

sonar.qualitygate.wait=true
