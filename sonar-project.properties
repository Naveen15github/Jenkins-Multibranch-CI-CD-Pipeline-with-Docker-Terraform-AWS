sonar.projectKey=jenkins-cicd-pipeline
sonar.projectName=Jenkins CI/CD Pipeline
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Disable JavaScript/TypeScript sensor (requires Node.js 18+)
# This skips detailed JS analysis but still does basic code quality checks
sonar.javascript.exclusions=**/*

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=node_modules/**,coverage/**,scripts/**

sonar.coverage.exclusions=src/server.js

sonar.qualitygate.wait=true
