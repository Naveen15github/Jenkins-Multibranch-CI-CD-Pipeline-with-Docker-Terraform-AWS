sonar.projectKey=jenkins-cicd-pipeline
sonar.projectName=Jenkins CI/CD Pipeline
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Skip JavaScript/TypeScript analysis (requires Node.js 18+)
# SonarQube will still analyze code structure, but not run JS-specific rules
sonar.javascript.node.maxspace=4096
sonar.exclusions=node_modules/**,coverage/**,scripts/**,**/*.js,**/*.ts

sonar.coverage.exclusions=src/server.js

sonar.qualitygate.wait=true
